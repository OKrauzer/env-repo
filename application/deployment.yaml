apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app-repo
  name: app-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-repo
  template:
    metadata:
      labels:
        app: app-repo
    spec:
      containers:
      - image: okostanths/app-repo:v1.0.4
        name: app-repo
        ports:
        - containerPort: 8080
